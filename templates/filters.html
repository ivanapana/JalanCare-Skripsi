<form novalidate class="filters" method="get"><label>{{ t('Kabupaten/kota','District/city') }}<select name="kabupaten"><option value="">{{ t('Semua wilayah','All areas') }}</option>{% for r in regions %}<option {{ 'selected' if request.args.get('kabupaten')==r }}>{{ r }}</option>{% endfor %}<option value="Tondano" {{ 'selected' if request.args.get('kabupaten')=='Tondano' }}>Tondano (Minahasa)</option></select></label><label>Status<select name="status"><option value="">{{ t('Semua status','All statuses') }}</option>{% for s in statuses %}<option value="{{ s }}" {{ 'selected' if request.args.get('status')==s }}>{{ status_text(s) }}</option>{% endfor %}</select></label><label>{{ t('Dari tanggal','From date') }}<input name="start" type="date" value="{{ request.args.get('start','') }}"></label><label>{{ t('Sampai tanggal','To date') }}<input name="end" type="date" value="{{ request.args.get('end','') }}"></label><button>{{ t('Terapkan','Apply') }}</button></form>
